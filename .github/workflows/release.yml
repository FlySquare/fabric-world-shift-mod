name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: microsoft

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew build --no-daemon

      - name: Resolve jar
        id: jar
        run: |
          JAR=$(ls build/libs/*[0-9].jar | grep -v sources | grep -v javadoc | head -n 1)
          echo "path=$JAR" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$JAR")" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.jar.outputs.path }}
          name: World Shift ${{ github.ref_name }}
          generate_release_notes: false
          body: |
            ## World Shift ${{ github.ref_name }}

            Fabric mod for Minecraft **26.2**.

            ### Install
            1. Download `${{ steps.jar.outputs.name }}` below
            2. Install Fabric Loader + Fabric API for 26.2
            3. Put the jar in your `mods` folder

            ### Links
            - Repository: https://github.com/FlySquare/fabric-world-shift-mod
            - Latest release: https://github.com/FlySquare/fabric-world-shift-mod/releases/latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
